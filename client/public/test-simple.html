<!DOCTYPE html>
<html>
<head>
  <title>Simple Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #log { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; background: #f5f5f5; }
    .log-entry { margin: 5px 0; font-size: 12px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>App Loading Test</h1>
  <div id="log"></div>
  
  <script src="/react.min.js"></script>
  <script src="/react-dom.min.js"></script>
  <script src="/navi-api.js"></script>
  
  <script>
    const logEl = document.getElementById('log');
    
    function log(msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }
    
    log('Page loaded');
    
    // Check dependencies
    setTimeout(() => {
      log('React: ' + (typeof window.React !== 'undefined' ? 'LOADED' : 'MISSING'), 
          typeof window.React !== 'undefined' ? 'success' : 'error');
      log('ReactDOM: ' + (typeof window.ReactDOM !== 'undefined' ? 'LOADED' : 'MISSING'),
          typeof window.ReactDOM !== 'undefined' ? 'success' : 'error');
      log('NaviAPI: ' + (typeof window.NaviAPI !== 'undefined' ? 'LOADED' : 'MISSING'),
          typeof window.NaviAPI !== 'undefined' ? 'success' : 'error');
      
      if (window.React && window.ReactDOM && window.NaviAPI) {
        log('✅ All dependencies loaded!', 'success');
        
        // Try to render a simple component
        try {
          const root = ReactDOM.createRoot(document.body);
          root.render(React.createElement('div', null, '✅ React rendering works!'));
          log('✅ React rendering successful!', 'success');
        } catch(e) {
          log('❌ React rendering failed: ' + e.message, 'error');
        }
      } else {
        log('❌ Missing dependencies', 'error');
      }
    }, 100);
  </script>
</body>
</html>
