<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1a2e1e"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Navi"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<title>Navi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f2;--bg2:#ffffff;--bg3:#f0ebe4;
  --text:#1a2e1e;--text2:#6b7a6e;--text3:#a0ada2;
  --accent:#1a2e1e;--accent2:#2d6a3f;--accent-bg:#f0f8f2;
  --green:#2d6a3f;--green-bg:#e8f4ec;
  --red:#c0392b;--red-bg:#fdf0ef;
  --border:#e4dfd8;
  --shadow:0 2px 12px rgba(26,46,30,.06);
  --shadow-lg:0 8px 32px rgba(26,46,30,.1);
  --radius:14px;--radius-sm:8px;
  --font-d:'Playfair Display',serif;--font-b:'Manrope',sans-serif;
  --tab-h:64px;--hdr-h:56px;
}

html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-b);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
/* HEADER */
.hdr{height:var(--hdr-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;z-index:10}
.logo{font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--text);flex:1;display:flex;align-items:baseline;gap:3px;letter-spacing:-.3px}
.logo span{font-family:var(--font-b);font-weight:800;font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:2.5px;margin-bottom:1px}
.logo-dot{width:5px;height:5px;background:var(--green);border-radius:50%;margin-bottom:3px;flex-shrink:0}
/* TABS */
.tab-bar{height:var(--tab-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-shrink:0;z-index:50}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:none;padding:0;position:relative}
.tab-item::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--green);border-radius:0 0 2px 2px;transform:scaleX(0);transition:transform .25s}
.tab-item.active::before{transform:scaleX(1)}
.tab-icon{font-size:20px;transition:transform .2s;opacity:.3;filter:grayscale(1)}
.tab-item.active .tab-icon{transform:scale(1.1);opacity:1;filter:none}
.tab-label{font-family:var(--font-b);font-size:8px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;transition:color .2s}
.tab-item.active .tab-label{color:var(--green)}
/* SCROLL */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:0;height:0}
.scroll-area::-webkit-scrollbar{display:none}
/* FILTER */
.filter-bar{padding:12px 16px 8px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:5}
.search-input{width:100%;padding:9px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg3);color:var(--text);font-family:var(--font-b);font-size:13px;outline:none;transition:border-color .2s;font-weight:500}
.search-input:focus{border-color:var(--green)}
.search-input::placeholder{color:var(--text3)}
.cat-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cat-scroll::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text2);font-family:var(--font-b);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;flex-shrink:0}
.chip.active{background:var(--text);border-color:var(--text);color:#fff}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-family:var(--font-b);font-size:13px;font-weight:700;transition:all .18s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--text);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--green);color:var(--green)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1.5px solid transparent}
.btn-green{background:#25d366;color:#fff}
.btn-sm{padding:7px 13px;font-size:12px}
.btn-full{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9px;background:var(--bg3);border:1px solid var(--border);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s}
.btn-icon:active{transform:scale(.9)}
/* FAB */
.fab{position:fixed;bottom:calc(var(--tab-h) + 16px);right:calc(max(16px, (100vw - 480px)/2 + 16px));width:52px;height:52px;border-radius:14px;background:var(--text);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 6px 24px rgba(26,46,30,.3);display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:40}
.fab:active{transform:scale(.94)}
/* CARDS */
.listings-grid{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--bg2);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card-photo{position:relative;background:var(--bg3);height:140px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-photo img{width:100%;height:100%;object-fit:contain;background:var(--bg3)}
.card-photo-icon{font-size:48px;opacity:.2}
.cat-badge{position:absolute;top:10px;left:10px;background:var(--bg2);color:var(--green);font-family:var(--font-b);font-size:9px;font-weight:700;padding:4px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:1px;border:1px solid var(--green-bg)}
.exp-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;backdrop-filter:blur(4px)}
.card-body{padding:14px}
.card-title{font-family:var(--font-d);font-size:14px;font-weight:700;margin-bottom:4px;line-height:1.3;color:var(--text)}
.card-desc{font-size:12px;color:var(--text2);margin-bottom:10px;font-weight:500}
.search-highlight{background:rgba(180,140,60,0.25);color:var(--text);border-radius:3px;padding:0 2px;font-weight:700}
.results-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 16px 6px;background:var(--bg2);border-bottom:1px solid var(--border)}
.results-count{font-size:12px;color:var(--text3);font-weight:600;white-space:nowrap;flex-shrink:0}
.active-filter-tag{display:inline-flex;align-items:center;gap:4px;background:var(--green-bg);color:var(--green);border:1px solid rgba(45,106,63,.3);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:background .15s;flex-shrink:0}
.active-filter-tag:hover{background:var(--green);color:#fff}
.search-hint{font-size:11px;color:var(--text3);padding:2px 0 0 0;font-style:italic;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{font-family:var(--font-b);font-size:17px;font-weight:800;color:var(--text);margin-bottom:12px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:480px;margin:0 auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 20px 36px;max-height:90dvh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-family:var(--font-d);font-size:16px;font-weight:700;margin-bottom:18px;color:var(--text)}
.form-group{margin-bottom:13px}
.form-label{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.form-input{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg3);color:var(--text);font-family:var(--font-b);font-size:14px;outline:none;transition:border-color .2s;font-weight:500}
.form-input:focus{border-color:var(--green)}
.form-textarea{min-height:80px;resize:none}
.modal-actions{display:flex;gap:8px;margin-top:16px}
/* BIZ PAGE */
.biz-cover{position:relative;background:var(--bg3);height:180px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.biz-cover img{width:100%;height:100%;object-fit:cover}
.biz-cover-icon{font-size:52px;opacity:.2}
.biz-logo{position:absolute;bottom:-24px;left:16px;width:56px;height:56px;border-radius:14px;background:var(--bg2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;box-shadow:var(--shadow)}
.biz-logo img{width:100%;height:100%;object-fit:cover}
.biz-info{padding:32px 16px 14px}
.biz-name-page{font-family:var(--font-d);font-size:20px;font-weight:700;margin-bottom:4px;color:var(--text)}
.biz-desc-page{font-size:13px;color:var(--text2);margin-bottom:10px;font-weight:500;line-height:1.5}
.biz-rating{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.biz-rating-stars{color:#f0a500;font-size:13px;letter-spacing:1px}
.biz-rating-val{font-family:var(--font-b);font-size:14px;font-weight:800;color:var(--text)}
.biz-rating-cnt{font-size:12px;color:var(--text3)}
.biz-tags-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.biz-tag-pill{padding:4px 10px;background:var(--green-bg);border:1px solid rgba(45,106,63,.2);border-radius:6px;font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
.open-badge{padding:4px 10px;background:var(--green-bg);border:1px solid rgba(45,106,63,.25);border-radius:6px;font-size:10px;font-weight:700;color:var(--green)}
.closed-badge{padding:4px 10px;background:var(--red-bg);border:1px solid rgba(192,57,43,.2);border-radius:6px;font-size:10px;font-weight:700;color:var(--red)}
/* SECTION EYEBROW */
.section-eyebrow{font-family:var(--font-b);font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:2px;padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
.section-eyebrow::after{content:'';flex:1;height:1px;background:var(--border)}
/* PRODUCT ROW */
.prod-row{background:var(--bg2);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bg3)}
.prod-thumb{width:46px;height:46px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.prod-thumb img{width:100%;height:100%;object-fit:contain;background:var(--bg3)}
.prod-name-r{font-family:var(--font-b);font-size:13px;font-weight:700;color:var(--text);flex:1}
.prod-price-r{font-family:var(--font-b);font-size:13px;font-weight:800;color:var(--text);flex-shrink:0}
.prod-unit-r{font-size:10px;color:var(--text3);font-weight:500}
.prod-add-btn{width:30px;height:30px;background:var(--text);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;flex-shrink:0;border:none;cursor:pointer}
/* FEED */
.feed-post{background:var(--bg2);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.feed-media{position:relative;background:var(--bg3);min-height:200px;display:flex;align-items:center;justify-content:center}
.feed-media img,.feed-media video{width:100%;display:block;object-fit:cover}
.feed-meta{padding:10px 14px}
.feed-author{font-family:var(--font-b);font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.feed-reactions{display:flex;gap:6px;flex-wrap:wrap}
.feed-react-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--bg3);font-size:13px;cursor:pointer;transition:all .2s}
.feed-react-btn.reacted{background:var(--green-bg);border-color:rgba(45,106,63,.3)}
.feed-react-count{font-size:12px;font-weight:700;color:var(--text2)}
.feed-time{font-size:10px;color:var(--text3);margin-top:8px;font-weight:500}
.feed-upload{border:2px dashed var(--border);border-radius:var(--radius);padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-align:center;transition:border-color .2s;background:var(--bg3)}
.feed-upload:hover{border-color:var(--green)}
/* AUTH */
.auth-screen{display:flex;flex-direction:column;align-items:center;padding:40px 24px;gap:14px;text-align:center}
.auth-icon{font-size:52px}
.auth-title{font-family:var(--font-d);font-size:18px;font-weight:700;color:var(--text)}
.auth-sub{font-size:13px;color:var(--text2);font-weight:500}
.code-inputs{display:flex;gap:10px;justify-content:center}
.code-digit{width:56px;height:62px;border-radius:10px;border:2px solid var(--border);background:var(--bg3);color:var(--text);font-family:var(--font-b);font-size:24px;font-weight:800;text-align:center;outline:none;transition:border-color .2s}
.code-digit:focus{border-color:var(--green)}
/* CABINET */
.cabinet{padding:14px;display:flex;flex-direction:column;gap:12px}
.cab-header{background:var(--bg2);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)}
.cab-avatar{width:52px;height:52px;border-radius:12px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:1px solid rgba(45,106,63,.15)}
.cab-name{font-family:var(--font-d);font-size:15px;font-weight:700;color:var(--text)}
.cab-phone{font-size:12px;color:var(--text3);font-weight:500}
.sub-card{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)}
.sub-value{font-family:var(--font-b);font-size:13px;font-weight:700;color:var(--green)}
.sub-value.exp{color:var(--red)}
/* ADMIN */
.admin-wrap{padding:14px;display:flex;flex-direction:column;gap:10px}
.admin-tabs{display:flex;gap:6px;margin-bottom:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;font-family:var(--font-b)}
.admin-tab.active{background:var(--text);border-color:var(--text);color:#fff}
.price-settings-bar{display:flex;gap:8px;padding:10px 14px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
.price-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg3);cursor:pointer;transition:all .2s}
.price-btn:active{transform:scale(.97)}
.price-btn-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.price-btn-value{font-family:var(--font-b);font-size:12px;font-weight:800;color:var(--text)}
.admin-row{background:var(--bg2);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:10px;border:1px solid var(--border)}
.admin-row-info{flex:1;min-width:0}
.admin-row-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.admin-row-sub{font-size:11px;color:var(--text3);font-weight:500}
.badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;background:var(--green-bg);color:var(--green)}
.badge.off{background:var(--red-bg);color:var(--red)}
/* SCHEDULE */
.schedule-editor{display:flex;flex-direction:column;gap:6px}
.schedule-row-edit{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.schedule-row-edit:last-child{border-bottom:none}
.schedule-day-label{width:28px;font-size:12px;font-weight:700;color:var(--text2);flex-shrink:0}
.schedule-time-input{flex:1;padding:6px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;outline:none;text-align:center;font-family:var(--font-b);font-weight:600}
.schedule-time-input:focus{border-color:var(--green)}
.schedule-toggle{width:36px;height:20px;border-radius:10px;border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .2s}
/* REVIEWS */
.review-item{padding:10px 0;border-bottom:1px solid var(--border)}
.review-item:last-child{border-bottom:none}
.review-stars{color:#f0a500;font-size:16px;margin-bottom:3px}
.review-text{font-size:13px;color:var(--text2);margin-bottom:3px;font-weight:500}
.review-author{font-size:11px;color:var(--text3);font-weight:600}
.star-btn{font-size:28px;background:none;border:none;cursor:pointer;padding:2px;transition:transform .15s}
.star-btn:active{transform:scale(.85)}
/* ANNOUNCEMENTS */
.ann-banner{margin:10px 16px 0;border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;animation:fadeUp .3s ease;border-left:3px solid}
.ann-banner.important{background:#fff8e8;border-color:#f0a500}
.ann-banner.news{background:var(--green-bg);border-color:var(--green)}
.ann-banner.event{background:#f0f4ff;border-color:#4a6cf0}

.ann-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.ann-body{flex:1}
.ann-title{font-family:var(--font-d);font-size:13px;font-weight:700;margin-bottom:3px;color:var(--text)}
.ann-text{font-size:12px;color:var(--text2);line-height:1.5;font-weight:500}
.ann-date{font-size:10px;color:var(--text3);margin-top:4px;font-weight:600}
/* DELIVERY */
.delivery-modal{width:100%;max-width:480px;margin:0 auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 20px 36px;max-height:92dvh;overflow-y:auto;animation:slideUp .3s ease}
.kaspi-box{background:var(--green-bg);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;border:1px solid rgba(45,106,63,.15)}
.kaspi-number{font-family:var(--font-b);font-size:17px;font-weight:800;color:var(--text);letter-spacing:.5px}
.kaspi-label{font-size:10px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.cart-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.cart-item:last-child{border-bottom:none}
.cart-img{width:48px;height:48px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;border:1px solid var(--border)}
.cart-img img{width:100%;height:100%;object-fit:cover}
.qty-btn{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border);background:var(--bg3);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;color:var(--text);flex-shrink:0}
.qty-btn:active{transform:scale(.9)}
.order-total{background:var(--green-bg);border-radius:var(--radius-sm);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin:12px 0;border:1px solid rgba(45,106,63,.15)}
/* MISC */
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--green);font-size:13px;font-weight:700;padding:12px 16px 4px;font-family:var(--font-b)}
.empty{display:flex;flex-direction:column;align-items:center;padding:60px 24px 40px;gap:0;text-align:center}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty-title{font-size:17px;color:var(--text);font-weight:700;font-family:var(--font-b);margin-bottom:6px}
.empty-text{font-size:13px;color:var(--text3);font-weight:500;line-height:1.5;max-width:220px}
.empty-hint{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.empty-hint-chip{padding:6px 14px;border-radius:20px;background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);transition:all .18s}
.empty-hint-chip:hover{border-color:var(--green);color:var(--green)}
.toast{position:fixed;bottom:calc(var(--tab-h) + 20px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg2);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;animation:toastIn .25s ease,toastOut .25s ease 2.2s both;white-space:nowrap;font-family:var(--font-b)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0}}
.offline-bar{background:var(--red-bg);color:var(--red);font-size:12px;font-weight:600;text-align:center;padding:5px 12px;flex-shrink:0}
.entrepreneur-banner{margin:12px 16px 0;background:var(--text);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 4px 16px rgba(26,46,30,.25)}
.entrepreneur-banner-icon{font-size:32px}
.entrepreneur-banner-text{flex:1}
.entrepreneur-banner-title{font-family:var(--font-d);font-size:14px;font-weight:700;color:#fff}
.entrepreneur-banner-sub{font-size:12px;color:rgba(255,255,255,.65);font-weight:500}
.entrepreneur-banner-arrow{font-size:20px;color:#fff;opacity:.7}
/* FAVORITES */
.biz-fav-btn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .15s,background .15s;z-index:5;backdrop-filter:blur(4px)}
.biz-fav-btn:active{transform:scale(.85)}
.biz-fav-btn.active{background:rgba(255,80,80,.12)}
.fav-filter-row{display:flex;gap:6px;padding:0 0 4px}
.fav-filter-btn{flex:1;padding:7px 0;border-radius:20px;border:2px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;font-family:var(--font-b)}
.fav-filter-btn.active{border-color:var(--red,#e53935);background:rgba(229,57,53,.08);color:var(--red,#e53935)}
</style>
